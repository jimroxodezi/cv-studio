services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    volumes:
      - cv_pgdata:/var/lib/postgresql/data
    ports:
      # localhost only: the app reaches Postgres over the Compose network
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      # localhost only: Tailscale Funnel proxies to this port on the host
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://cv:cv@db:5432/cv
    depends_on:
      db:
        condition: service_healthy

volumes:
  cv_pgdata:
